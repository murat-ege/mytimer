<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C0A" />
      <stop offset="50%" stop-color="#121814" />
      <stop offset="100%" stop-color="#060907" />
    </linearGradient>

    <!-- Electric Green Gradient -->
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69F0AE" />
      <stop offset="50%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#00B0FF" />
    </linearGradient>

    <!-- Fiery Accent Gradient -->
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FF9100" />
      <stop offset="100%" stop-color="#FF3D00" />
    </linearGradient>

    <!-- Metal Crown Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A4640" />
      <stop offset="50%" stop-color="#6E7E76" />
      <stop offset="100%" stop-color="#222B26" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur2" />
    </filter>
  </defs>

  <!-- Squircle Base with App Icon Clipping Shape -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#bgGrad)" stroke="#1F2E26" stroke-width="6" />

  <!-- Background Ambient Glow -->
  <circle cx="512" cy="540" r="340" fill="#00E676" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="512" cy="540" r="240" fill="#FF9100" opacity="0.08" filter="url(#softGlow)" />

  <!-- Stopwatch Top Crown & Clickers -->
  <!-- Top Stem -->
  <rect x="480" y="90" width="64" height="60" rx="10" fill="url(#metalGrad)" />
  <!-- Top Push Button -->
  <rect x="444" y="60" width="136" height="38" rx="14" fill="url(#neonGreen)" />
  <!-- Left Clicker 45deg -->
  <g transform="rotate(-35 512 540)">
    <rect x="488" y="115" width="48" height="40" rx="8" fill="url(#metalGrad)" />
    <rect x="472" y="90" width="80" height="28" rx="10" fill="url(#fireGrad)" />
  </g>
  <!-- Right Clicker 45deg -->
  <g transform="rotate(35 512 540)">
    <rect x="488" y="115" width="48" height="40" rx="8" fill="url(#metalGrad)" />
    <rect x="472" y="90" width="80" height="28" rx="10" fill="url(#metalGrad)" />
  </g>

  <!-- Outer Stopwatch Rim -->
  <circle cx="512" cy="540" r="350" fill="#141B17" stroke="#25352C" stroke-width="18" />
  <circle cx="512" cy="540" r="328" fill="#0D1310" stroke="#101713" stroke-width="4" />

  <!-- Dial Ticks (Hours / Minutes) -->
  <g stroke="#354A3E" stroke-width="6" stroke-linecap="round">
    <!-- 12 Ticks around the clock -->
    <line x1="512" y1="230" x2="512" y2="255" stroke="#00E676" stroke-width="8" />
    <line x1="667" y1="272" x2="655" y2="294" />
    <line x1="782" y1="387" x2="760" y2="399" />
    <line x1="822" y1="540" x2="797" y2="540" stroke="#FF9100" stroke-width="8" />
    <line x1="782" y1="693" x2="760" y2="681" />
    <line x1="667" y1="808" x2="655" y2="786" />
    <line x1="512" y1="850" x2="512" y2="825" stroke="#00E676" stroke-width="8" />
    <line x1="357" y1="808" x2="369" y2="786" />
    <line x1="242" y1="693" x2="264" y2="681" />
    <line x1="202" y1="540" x2="227" y2="540" stroke="#00E676" stroke-width="8" />
    <line x1="242" y1="387" x2="264" y2="399" />
    <line x1="357" y1="272" x2="369" y2="294" />
  </g>

  <!-- Dynamic Progress Arc (Tabata Interval in progress - 270 degrees) -->
  <path d="M 512 245 A 295 295 0 1 1 245 640" 
        fill="none" 
        stroke="url(#neonGreen)" 
        stroke-width="26" 
        stroke-linecap="round" 
        filter="url(#neonGlow)" />

  <!-- Remaining Rest Arc (Orange segment) -->
  <path d="M 252 620 A 295 295 0 0 1 480 248" 
        fill="none" 
        stroke="url(#fireGrad)" 
        stroke-width="12" 
        stroke-linecap="round" 
        stroke-dasharray="14 14"
        opacity="0.85" />

  <!-- Glowing Leading Head Dot -->
  <circle cx="245" cy="640" r="18" fill="#FFFFFF" />
  <circle cx="245" cy="640" r="28" fill="#69F0AE" opacity="0.6" filter="url(#neonGlow)" />

  <!-- Center Core Display Badge -->
  <circle cx="512" cy="540" r="195" fill="#151D18" stroke="#1D2A23" stroke-width="8" />

  <!-- Lightning Bolt / Dynamic Energy in Center -->
  <path d="M 535 390 L 455 525 L 515 525 L 485 675 L 585 510 L 525 510 Z" 
        fill="url(#neonGreen)" 
        filter="url(#neonGlow)" />

  <!-- Stylized Monogram "T" / Crossbar -->
  <path d="M 410 420 L 614 420 L 595 450 L 429 450 Z" fill="#FFFFFF" opacity="0.9" />

  <!-- Digital Accent Dots (Stopwatch Colon Indicator) -->
  <circle cx="390" cy="540" r="9" fill="#00E676" />
  <circle cx="634" cy="540" r="9" fill="#FF9100" />

  <!-- Bottom Brand Badge (High-Contrast, Crisp & Ultra Legible) -->
  <rect x="292" y="745" width="440" height="74" rx="24" fill="#0C1410" stroke="#00E676" stroke-width="4.5" />
  <text x="512" y="797" 
        text-anchor="middle" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="46" 
        font-weight="900" 
        letter-spacing="10" 
        fill="#FFFFFF">MYTIMER</text>
</svg>
