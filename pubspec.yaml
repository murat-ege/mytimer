name: mytimer
description: "A versatile workout and interval timer app designed for CrossFit, Tabata, HIIT, and custom routines."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.1
  audioplayers: ^6.8.1
  uuid: ^4.6.0
  flutter_local_notifications: ^22.3.2
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  flutter_tts: ^4.2.5
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  csv: ^8.0.0
  path_provider: ^2.1.6
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/sounds/silent.wav
    - assets/icon/
    - assets/data/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
